name: Moog CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run security regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build

      - name: Smoke test production server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/moog-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/moog-home.html; then
              break
            fi
            sleep 1
          done
          grep -q 'Share it.' /tmp/moog-home.html
