name: Cleanup expired Moog shares

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired shares
        env:
          APP_URL: ${{ secrets.MOOG_APP_URL || 'https://lucid-radiance-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.MOOG_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure MOOG_CRON_SECRET in GitHub Actions secrets. MOOG_APP_URL is optional."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/cleanup"
